server {
    listen 80;
    server_name lisper.ru;

    # Security headers. The app also sets its own (CSP, X-Frame-Options DENY,
    # nosniff, Referrer-Policy) — duplicating them here is harmless, but the
    # CSP must stay in one place: lisper's own header is the authoritative one.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # lisper (container, published on 8080)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # jscl.js is 2.4 MB and bundles are large — don't buffer them.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # For a real deployment put this behind TLS, e.g.:
    #   listen 443 ssl;
    #   ssl_certificate     /etc/letsencrypt/live/lisper.ru/fullchain.pem;
    #   ssl_certificate_key /etc/letsencrypt/live/lisper.ru/privkey.pem;
    #   return 301 https://$host$request_uri;
}
