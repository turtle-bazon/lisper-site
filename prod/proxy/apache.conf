<VirtualHost *:80>
    # Both domains serve the same app; it derives canonical/hreflang/og:url
    # from the request Host (whitelist: :site-hosts in lisper.conf).
    ServerName lisper.ru
    ServerAlias lisper.nl

    # Безопасность-заголовки НЕ дублируются здесь намеренно: приложение
    # шлёт их само (src/routes.lisp security-headers), а Header set на
    # проксированном ответе НЕ заменяет заголовок апстрима, а добавляет
    # второй — были дубликаты X-Frame-Options/nosniff/Referrer-Policy.
    # Второй X-Frame-Options с неопределённой семантикой, два CSP
    # пересекаются и молча ломают скрипты. Добавлять здесь можно только
    # то, чего приложение не умеет: Strict-Transport-Security на 443-vhost.

    <Location />
        # lisper (container, published on 8080).
        # ProxyPreserveHost обязателен: без него приложение увидит
        # Host: 127.0.0.1:8080, которого нет в :site-hosts, и canonical/
        # og:url/sitemap откатятся на :site-url.
        ProxyPreserveHost On
        ProxyAddHeaders On
        # Схема для canonical/og:url, когда TLS терминируется на Apache.
        RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

        ProxyPass / http://127.0.0.1:8080/
        ProxyPassReverse / http://127.0.0.1:8080/
    </Location>
</VirtualHost>
